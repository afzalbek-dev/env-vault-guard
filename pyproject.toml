[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "env-vault-guard"
version = "0.1.0"
description = "CLI and Python SDK for .env drift detection, missing environment variable validation, and encrypted secrets synchronization."
readme = "README.md"
authors = [{ name = "Afzalbek", email = "afzalbek-dev@users.noreply.github.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"

[project.scripts]
env-vault-guard = "env_vault_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
